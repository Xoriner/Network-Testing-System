services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: netperf
      POSTGRES_USER: netperf
      POSTGRES_PASSWORD: netperf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

volumes:
  pgdata: